<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F&O Analysis Desk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>F&O Analysis Desk</h1>
<p>Welcome to your mobile trading dashboard.</p>

<div class="card">
<h2>NIFTY</h2>
<p id="nifty">Loading...</p>
</div>

<div class="card">
<h2>BANKNIFTY</h2>
<p id="bank">Loading...</p>
</div>

<div class="card">
<h2>Trading Risk Calculator</h2>
<label>Entry premium</label>
<input id="entry" type="number" value="100">
<label>Stop loss</label>
<input id="stop" type="number" value="80">
<button onclick="calculateRisk()">Calculate</button>
<p id="result"></p>
</div>

<script src="app.js"></script>
</body>
</html>
